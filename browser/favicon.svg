<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F24"/>
      <stop offset="50%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA055"/>
      <stop offset="50%" stop-color="#FD6F00"/>
      <stop offset="100%" stop-color="#D95300"/>
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FD6F00" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#FD6F00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFA055" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#FD6F00" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle with Glowing Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10"/>

  <!-- Subtle Developer Grid Pattern / Modern Accent -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Stylized "H." Monogram -->
  <!-- Left Pillar (Pure Crisp White with Subtle Rounded Caps) -->
  <rect x="130" y="124" width="60" height="264" rx="14" fill="#FFFFFF"/>

  <!-- Center Bridge (Vibrant Brand Orange with Glow) -->
  <g filter="url(#neonGlow)">
    <rect x="180" y="226" width="152" height="60" rx="6" fill="url(#orangeGrad)"/>
    
    <!-- Right Pillar (Vibrant Brand Orange) -->
    <rect x="322" y="124" width="60" height="264" rx="14" fill="url(#orangeGrad)"/>

    <!-- Signature "Hrithik." Brand Dot -->
    <circle cx="418" cy="368" r="22" fill="url(#orangeGrad)"/>
  </g>
</svg>
